name: notes-app

services:
  # Единственный сервис с опубликованным портом. Только в сети front.
  web:
    image: nginx:1.30-alpine
    ports:
      - "${WEB_PORT:-18080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - front
    restart: unless-stopped

  # Единственный сервис в обеих сетях: принимает из front, ходит в back.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: cache
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - front
      - back
    mem_limit: 256m
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # postgres:18 объявляет том на /var/lib/postgresql, а не на .../data.
      # PGDATA внутри = /var/lib/postgresql/18/docker. Подробности в REPORT.md.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    networks:
      - back
    restart: unless-stopped

  cache:
    image: redis:8.8-alpine
    # Тома нет сознательно: счётчик посещений — эфемерное состояние.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - back
    restart: unless-stopped

  # Сетевые утилиты для проверок изоляции. Поднимается только с --profile debug.
  netshoot-front:
    image: nicolaka/netshoot
    command: ["sleep", "infinity"]
    profiles: ["debug"]
    networks:
      - front
    restart: unless-stopped

networks:
  front:
  back:

volumes:
  pgdata:
